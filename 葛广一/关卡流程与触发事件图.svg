<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">关卡流程与触发事件图</title>
  <desc id="desc">玩家从起始区域进入普通小兵区，遇到被阻挡的门后转向左侧落石机关，击败骷髅王后开启通路，再通过蹬墙平台区进入Boss区域。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#333333"/>
    </marker>
    <marker id="arrow-muted" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#6b7280"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f9fafb; stroke: #333333; stroke-width: 2; rx: 0; }
      .box-key { fill: #fffaf0; stroke: #c77f1a; stroke-width: 3; rx: 0; }
      .box-boss { fill: #fff6f6; stroke: #c62828; stroke-width: 3; rx: 0; }
      .title-text {
        font-family: "Microsoft YaHei", "SimSun", "Noto Sans CJK SC", sans-serif;
        font-size: 21px;
        font-weight: 600;
        fill: #222222;
      }
      .sub-text {
        font-family: "Microsoft YaHei", "SimSun", "Noto Sans CJK SC", sans-serif;
        font-size: 16px;
        fill: #555555;
      }
      .label {
        font-family: "Microsoft YaHei", "SimSun", "Noto Sans CJK SC", sans-serif;
        font-size: 16px;
        font-weight: 600;
        fill: #4b5563;
      }
      .arrow { fill: none; stroke: #333333; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-thin { fill: none; stroke: #333333; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-dashed { fill: none; stroke: #6b7280; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="460"/>

  <!-- Top path -->
  <g id="top-path">
    <rect class="box" x="30" y="44" width="170" height="84"/>
    <text x="115" y="80" text-anchor="middle" class="title-text">起始区域</text>
    <text x="115" y="108" text-anchor="middle" class="sub-text">玩家进入关卡</text>

    <rect class="box" x="250" y="44" width="170" height="84"/>
    <text x="335" y="80" text-anchor="middle" class="title-text">普通小兵区</text>
    <text x="335" y="108" text-anchor="middle" class="sub-text">战斗与操作熟悉</text>

    <rect class="box-key" x="470" y="44" width="170" height="84"/>
    <text x="555" y="80" text-anchor="middle" class="title-text">门被阻挡</text>
    <text x="555" y="108" text-anchor="middle" class="sub-text">暂时无法进入右侧</text>

    <rect class="box" x="760" y="44" width="180" height="84"/>
    <text x="850" y="80" text-anchor="middle" class="title-text">蹬墙平台区</text>
    <text x="850" y="108" text-anchor="middle" class="sub-text">墙跳与平台移动</text>

    <rect class="box-boss" x="1050" y="44" width="170" height="84"/>
    <text x="1135" y="80" text-anchor="middle" class="title-text">Boss区域</text>
    <text x="1135" y="108" text-anchor="middle" class="sub-text">触发Boss战斗</text>
  </g>

  <!-- Bottom branch -->
  <g id="bottom-branch">
    <rect class="box" x="110" y="270" width="190" height="86"/>
    <text x="205" y="306" text-anchor="middle" class="title-text">左侧落石机关</text>
    <text x="205" y="334" text-anchor="middle" class="sub-text">检测玩家后下砸</text>

    <rect class="box" x="390" y="270" width="190" height="86"/>
    <text x="485" y="306" text-anchor="middle" class="title-text">击败骷髅王</text>
    <text x="485" y="334" text-anchor="middle" class="sub-text">高血量精英敌人</text>

    <rect class="box-key" x="690" y="270" width="190" height="86"/>
    <text x="785" y="306" text-anchor="middle" class="title-text">通路开启</text>
    <text x="785" y="334" text-anchor="middle" class="sub-text">阻挡砖块隐藏</text>
  </g>

  <!-- Main arrows -->
  <path class="arrow" d="M 200 86 L 242 86"/>
  <path class="arrow" d="M 420 86 L 462 86"/>
  <path class="arrow-dashed" d="M 640 86 C 675 86, 710 86, 752 86"/>
  <text x="692" y="68" text-anchor="middle" class="label">解锁前不可通行</text>
  <path class="arrow" d="M 940 86 L 1042 86"/>
  <text x="990" y="67" text-anchor="middle" class="label">继续前进</text>

  <!-- Branch arrows -->
  <path class="arrow-thin" d="M 555 128 C 548 190, 370 220, 215 265"/>
  <text x="385" y="225" text-anchor="middle" class="label">转向左侧支线</text>

  <path class="arrow" d="M 300 313 L 382 313"/>
  <path class="arrow" d="M 580 313 L 682 313"/>
  <text x="638" y="294" text-anchor="middle" class="label">击败事件触发</text>

  <path class="arrow-thin" d="M 785 270 C 770 205, 735 148, 726 93"/>
  <text x="738" y="206" text-anchor="middle" class="label">解卡并触发路线</text>
</svg>
