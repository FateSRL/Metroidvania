<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect x="0" y="0" width="720" height="400" fill="white"/>
  <text x="360" y="32" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#111111">系统总体架构图</text>

  <rect x="35" y="70" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
  <text x="107" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">输入与场景层</text>
  <text x="107" y="124" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">键盘输入 / Tilemap</text>
  <text x="107" y="142" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">玩家、敌人、Boss、机关</text>

  <rect x="288" y="70" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
  <text x="360" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">组件行为层</text>
  <text x="360" y="124" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">MonoBehaviour脚本</text>
  <text x="360" y="142" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">物理、碰撞、动画事件</text>

  <rect x="540" y="70" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
  <text x="612" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">状态控制层</text>
  <text x="612" y="124" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">Player / Enemy / Boss</text>
  <text x="612" y="142" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">移动、攻击、受击、死亡</text>

  <rect x="165" y="240" width="160" height="84" fill="white" stroke="#333333" stroke-width="1.4"/>
  <text x="245" y="270" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">战斗与技能层</text>
  <text x="245" y="294" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">Stats / Damage / Skill</text>
  <text x="245" y="312" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">飞剑、黑洞、Boss激光</text>

  <rect x="395" y="240" width="160" height="84" fill="white" stroke="#333333" stroke-width="1.4"/>
  <text x="475" y="270" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">界面与反馈层</text>
  <text x="475" y="294" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">血条 / 菜单 / 音效</text>
  <text x="475" y="312" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">暂停、死亡、通关提示</text>

  <line x1="180" y1="110" x2="288" y2="110" stroke="#333333" stroke-width="1.5"/>
  <polygon points="288,110 278,105 278,115" fill="#333333"/>
  <text x="234" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">输入驱动</text>

  <line x1="433" y1="110" x2="540" y2="110" stroke="#333333" stroke-width="1.5"/>
  <polygon points="540,110 530,105 530,115" fill="#333333"/>
  <text x="486" y="100" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">状态切换</text>

  <line x1="600" y1="150" x2="510" y2="240" stroke="#333333" stroke-width="1.5"/>
  <polygon points="510,240 520,236 514,230" fill="#333333"/>

  <line x1="555" y1="150" x2="300" y2="240" stroke="#333333" stroke-width="1.5"/>
  <polygon points="300,240 311,240 307,231" fill="#333333"/>
  <text x="418" y="211" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">碰撞与伤害判定</text>

  <line x1="325" y1="282" x2="395" y2="282" stroke="#333333" stroke-width="1.5"/>
  <polygon points="395,282 385,277 385,287" fill="#333333"/>
  <text x="360" y="272" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">生命值变化</text>

  <line x1="475" y1="324" x2="475" y2="355" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="475" y1="355" x2="245" y2="355" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="245" y1="355" x2="245" y2="324" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
  <polygon points="245,324 240,334 250,334" fill="#777777"/>
  <text x="360" y="377" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">血量、菜单、音效反馈</text>

  <line x1="245" y1="240" x2="105" y2="150" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
  <polygon points="105,150 112,159 117,151" fill="#777777"/>
</svg>
