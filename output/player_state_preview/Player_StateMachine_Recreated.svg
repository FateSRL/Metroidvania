<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760">
  <defs>
    <pattern id="smallGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#2b2b2b" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="url(#smallGrid)"/>
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1f1f1f" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="orange" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d98723"/>
      <stop offset="100%" stop-color="#a95605"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#238b3d"/>
      <stop offset="100%" stop-color="#096c29"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c9262a"/>
      <stop offset="100%" stop-color="#8b070a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6db4a5"/>
      <stop offset="100%" stop-color="#3a8677"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5c6063"/>
      <stop offset="100%" stop-color="#45494c"/>
    </linearGradient>
    <marker id="arrowWhite" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f2f2f2"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8b8b8b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8b5b05"/>
    </marker>
    <style>
      .label { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 15px; fill: #ededed; }
      .lineWhite { stroke: #8f8f8f; stroke-width: 3.2; fill: none; marker-end: url(#arrowWhite); opacity: .9; }
      .lineGray { stroke: #6d6d6d; stroke-width: 3.2; fill: none; marker-end: url(#arrowGray); opacity: .58; }
      .lineOrange { stroke: #6d4b06; stroke-width: 3.4; fill: none; marker-end: url(#arrowOrange); opacity: .95; }
      .node { filter: url(#shadow); stroke: rgba(255,255,255,.12); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1160" height="760" fill="#252525"/>
  <rect width="1160" height="760" fill="url(#grid)" opacity="0.95"/>

  <!-- Major transitions behind nodes -->
  <path d="M718,42 C555,45 400,49 238,58" class="lineWhite"/>
  <path d="M495,312 C570,275 650,238 724,164" class="lineOrange"/>

  <path d="M495,312 L612,244" class="lineGray"/>
  <path d="M495,312 L612,314" class="lineGray"/>
  <path d="M495,312 L612,384" class="lineGray"/>
  <path d="M495,312 L612,454" class="lineGray"/>
  <path d="M495,312 L612,524" class="lineGray"/>
  <path d="M495,312 L612,594" class="lineGray"/>
  <path d="M495,312 L612,664" class="lineGray"/>

  <path d="M748,164 L928,336" class="lineWhite"/>
  <path d="M785,244 L928,336" class="lineWhite"/>
  <path d="M792,314 L928,336" class="lineWhite"/>
  <path d="M795,384 L928,336" class="lineWhite"/>
  <path d="M796,454 L928,336" class="lineWhite"/>
  <path d="M796,524 L928,336" class="lineWhite"/>
  <path d="M795,594 L928,336" class="lineWhite"/>
  <path d="M794,664 L928,336" class="lineWhite"/>
  <path d="M1015,540 L1015,358" class="lineWhite"/>
  <path d="M790,594 L934,540" class="lineWhite"/>
  <path d="M716,524 L716,560" class="lineWhite"/>

  <!-- PlayerDie -->
  <rect x="84" y="48" width="234" height="46" rx="5" fill="url(#gray)" class="node"/>
  <text x="201" y="76" text-anchor="middle" class="label">PlayerDie</text>

  <!-- Any State -->
  <rect x="623" y="24" width="188" height="36" rx="5" fill="url(#teal)" class="node"/>
  <text x="717" y="47" text-anchor="middle" class="label">Any State</text>

  <!-- PrimaryAttack sub-state machine -->
  <path d="M30,294 L226,294 L246,317 L226,340 L30,340 L12,317 Z" fill="url(#gray)" class="node"/>
  <text x="129" y="323" text-anchor="middle" class="label">PrimaryAttack</text>

  <!-- Entry -->
  <rect x="306" y="294" width="188" height="36" rx="4" fill="url(#green)" class="node"/>
  <text x="400" y="318" text-anchor="middle" class="label">Entry</text>

  <!-- State nodes -->
  <rect x="611" y="118" width="235" height="47" rx="5" fill="url(#orange)" class="node"/>
  <text x="728.5" y="146" text-anchor="middle" class="label">PlayerIdle</text>

  <rect x="599" y="212" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="240" text-anchor="middle" class="label">PlayerMove</text>

  <rect x="599" y="282" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="310" text-anchor="middle" class="label">Jump/Fall</text>

  <rect x="599" y="352" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="380" text-anchor="middle" class="label">PlayerDash</text>

  <rect x="599" y="422" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="450" text-anchor="middle" class="label">PlayerWallSlide</text>

  <rect x="599" y="482" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="510" text-anchor="middle" class="label">PlayerCounterAttack</text>

  <rect x="599" y="552" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="580" text-anchor="middle" class="label">PlayerSuccessfulCounterAttack</text>

  <rect x="599" y="612" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="640" text-anchor="middle" class="label">PlayerAimSword</text>

  <rect x="599" y="682" width="235" height="47" rx="5" fill="url(#gray)" class="node"/>
  <text x="716.5" y="710" text-anchor="middle" class="label">PlayerCatchSword</text>

  <!-- Throw sword and Exit -->
  <rect x="917" y="505" width="234" height="46" rx="5" fill="url(#gray)" class="node"/>
  <text x="1034" y="533" text-anchor="middle" class="label">PlayerThrowSword</text>

  <rect x="928" y="317" width="188" height="35" rx="5" fill="url(#red)" class="node"/>
  <text x="1022" y="340" text-anchor="middle" class="label">Exit</text>
</svg>
