<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520">
  <rect x="0" y="0" width="860" height="520" fill="white"/>
  <g transform="translate(70,70)">
    <text x="360" y="34" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#111111">系统总体架构图</text>

    <rect x="35" y="85" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
    <text x="107" y="115" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">输入与场景层</text>
    <text x="107" y="139" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">键盘输入 / Tilemap</text>
    <text x="107" y="157" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">玩家、敌人、Boss、机关</text>

    <rect x="288" y="85" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
    <text x="360" y="115" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">组件行为层</text>
    <text x="360" y="139" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">MonoBehaviour脚本</text>
    <text x="360" y="157" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">物理、碰撞、动画事件</text>

    <rect x="540" y="85" width="145" height="80" fill="white" stroke="#333333" stroke-width="1.4"/>
    <text x="612" y="115" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">状态控制层</text>
    <text x="612" y="139" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">Player / Enemy / Boss</text>
    <text x="612" y="157" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">移动、攻击、受击、死亡</text>

    <rect x="165" y="260" width="160" height="84" fill="white" stroke="#333333" stroke-width="1.4"/>
    <text x="245" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">战斗与技能层</text>
    <text x="245" y="314" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">Stats / Damage / Skill</text>
    <text x="245" y="332" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">飞剑、黑洞、Boss激光</text>

    <rect x="395" y="260" width="160" height="84" fill="white" stroke="#333333" stroke-width="1.4"/>
    <text x="475" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="17" font-weight="bold" fill="#111111">界面与反馈层</text>
    <text x="475" y="314" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="13" fill="#222222">血条 / 菜单 / 音效</text>
    <text x="475" y="332" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">暂停、死亡、通关提示</text>

    <line x1="180" y1="125" x2="288" y2="125" stroke="#333333" stroke-width="1.5"/>
    <polygon points="288,125 278,120 278,130" fill="#333333"/>
    <text x="234" y="113" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">输入驱动</text>

    <line x1="433" y1="125" x2="540" y2="125" stroke="#333333" stroke-width="1.5"/>
    <polygon points="540,125 530,120 530,130" fill="#333333"/>
    <text x="486" y="113" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">状态切换</text>

    <line x1="600" y1="165" x2="510" y2="260" stroke="#333333" stroke-width="1.5"/>
    <polygon points="510,260 520,256 514,250" fill="#333333"/>

    <line x1="555" y1="165" x2="300" y2="260" stroke="#333333" stroke-width="1.5"/>
    <polygon points="300,260 311,260 307,251" fill="#333333"/>
    <text x="420" y="230" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">碰撞与伤害判定</text>

    <line x1="325" y1="302" x2="395" y2="302" stroke="#333333" stroke-width="1.5"/>
    <polygon points="395,302 385,297 385,307" fill="#333333"/>
    <text x="360" y="290" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">生命值变化</text>

    <line x1="475" y1="344" x2="475" y2="380" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="475" y1="380" x2="245" y2="380" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="245" y1="380" x2="245" y2="344" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
    <polygon points="245,344 240,354 250,354" fill="#777777"/>
    <text x="360" y="410" text-anchor="middle" font-family="SimSun, Microsoft YaHei, Arial" font-size="12" fill="#555555">血量、菜单、音效反馈</text>

    <line x1="245" y1="260" x2="105" y2="165" stroke="#777777" stroke-width="1.3" stroke-dasharray="5 4"/>
    <polygon points="105,165 112,174 117,166" fill="#777777"/>
  </g>
</svg>
